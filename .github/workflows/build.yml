name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q "*.zip" -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: proj/EsfahanSports
        run: gradle assembleDebug

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: proj/EsfahanSports
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/proj/EsfahanSports/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: EsfahanSports-debug-apk
          path: proj/EsfahanSports/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: EsfahanSports-release-apk
          path: proj/EsfahanSports/app/build/outputs/apk/release/app-release.apk
